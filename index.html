<p class="rv" style="margin: 0;">Yıllardır Türkiye'den ve dünyadan mesleki büyüklerimi, meslektaşlarımı, sektör yayınlarını ve sevdiğim yazarları takip ediyorum. Okudukça not alıyor, farklı fikirler arasında bağlantılar kuruyor, bazen de "Ben burada biraz farklı düşünüyorum" diyorum. Bu alışkanlık 12 yıllık kariyerim boyunca mesleki ve kişisel gelişimime çok katkı sağladı. Artık bu notlar her hafta Pazarlama Kulisi'nde buluşuyor.</p>
<p class="rv" style="margin: 0;">Bültende kampanyalar, araştırmalar ve pazarlama gündeminden seçtiklerim var. Her birinin ardından aynı soruya cevap arıyorum: <b style="color: #3A2550;">"Peki, bu bizim için ne demek?"</b> Bir marka yöneticisi, içerik üreticisi, ajans çalışanı ya da tüketici olarak buradan ne çıkarabiliriz? Yarın yaptığımız işe ne katabiliriz?</p>
<p class="rv" style="margin: 0;">Yıllardır markalarla, ajanslarla, influencer ve kanaat önderleriyle aynı masada çalışmanın, tüketicinin kalbine dokunan işler yaratabilmiş olmanın kazandırdığı bakışı da bu sorulara katıyorum. Bazen bir araştırmayı yorumluyor, bazen bir kampanyanın fikrini açıyor, bazen de kendi deneyimimden yola çıkarak bir konuyu tartışmaya açıyorum.</p>
<p class="rv" style="margin: 0;">Umarım okurken bazen "Bunu bilmiyordum", bazen "Ben de böyle düşünüyorum", bazen de "Bence başka bir açıklaması var" dersiniz. O sonuncusunu özellikle duymak isterim.</p>
