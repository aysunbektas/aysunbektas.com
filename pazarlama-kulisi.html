<div style="margin-top: 18px; font-size: 17px; line-height: 1.65; color: #CFC6DD; max-width: 760px;"><p style="margin: 0 0 16px;">Bir kampanyayı görünce yalnızca reklamını mı izliyorsunuz, yoksa "Bunu neden böyle yapmışlar?" diye de düşünüyor musunuz? Ben çoğu zaman ikinci soruda kalıyorum.</p><p style="margin: 0 0 16px;">Yıllardır Türkiye'den ve dünyadan mesleki büyüklerimi, meslektaşlarımı, sektör yayınlarını ve sevdiğim yazarları takip ediyorum. Okudukça not alıyor, farklı fikirler arasında bağlantılar kuruyor, bazen de "Ben burada biraz farklı düşünüyorum" diyorum. Bu alışkanlık 12 yıllık kariyerim boyunca mesleki ve kişisel gelişimime çok katkı sağladı. Artık bu notlar her hafta Pazarlama Kulisi'nde buluşuyor.</p><p style="margin: 0 0 16px;">Bültende kampanyalar, araştırmalar ve pazarlama gündeminden seçtiklerim var. Her birinin ardından aynı soruya cevap arıyorum: <b style="color: #3A2550;">"Peki, bu bizim için ne demek?"</b> Bir marka yöneticisi, içerik üreticisi, ajans çalışanı ya da tüketici olarak buradan ne çıkarabiliriz? Yarın yaptığımız işe ne katabiliriz?</p><p style="margin: 0 0 16px;">Yıllardır markalarla, ajanslarla, influencer ve kanaat önderleriyle aynı masada çalışmanın, tüketicinin kalbine dokunan işler yaratabilmiş olmanın kazandırdığı bakışı da bu sorulara katıyorum. Bazen bir araştırmayı yorumluyor, bazen bir kampanyanın fikrini açıyor, bazen de kendi deneyimimden yola çıkarak bir konuyu tartışmaya açıyorum.</p><p style="margin: 0 0 16px;">Umarım okurken bazen "Bunu bilmiyordum", bazen "Ben de böyle düşünüyorum", bazen de "Bence başka bir açıklaması var" dersiniz. O sonuncusunu özellikle duymak isterim.</p><span class="d" style="font-weight: 800; font-style: italic; font-size: 30px; color: #E85D2A;">Aysun</span></div>
