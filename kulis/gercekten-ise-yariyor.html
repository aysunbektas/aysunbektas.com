<h1 class="d" style="margin: 0; font-weight: 800; font-size: clamp(42px, 6vw, 80px); line-height: 0.98; letter-spacing: -0.05em;">500 influencer, tek soru: <span style="font-style: italic; color: #F5EFE6;">Gerçekten işe yarıyor mu?</span></h1>
<p style="margin: 0; font-size: 21px; line-height: 1.5; color: #3A2550;">Bir saç bakım markasında, kategorinin en büyük şüphesini reklamla bastırmak yerine markanın platformuna çevirdik. Bir kampanyanın perde arkası.</p>
<div style="display: flex; flex-wrap: wrap; gap: 14px; align-items: center; font-size: 15px; color: #4A3A62;">

<div style="max-width: 1100px; margin: 0 auto; padding: 0 24px;">
<img src="../assets/fa4e0188427853f9f7daa9b8518bb8c1.jpg" alt="Gerçekten İşe Yarıyor TV filminden kare" style="width: 100%; height: auto; border-radius: 20px; display: block;">
<div class="m" style="font-size: 11px; color: #6E5F82; margin-top: 12px;">Gerçekten İşe Yarıyor · TV filmi · 2024</div>
</div>
</div>

<article style="max-width: 720px; margin: 0 auto; padding: 64px 24px 24px;">
<p class="d" style="font-weight: 600; font-size: 26px; line-height: 1.35; letter-spacing: -0.015em;">Saç dökülmesi yaşayan biri, eczanede bir şampuan kutusunu eline aldığında aklında tek bir cümle vardır: "Peki bu gerçekten işe yarıyor mu?"</p>
<p>Kategorideki iletişimlerin çoğu bu soruyu duymazdan gelir. Daha büyük vaatler, daha parlak öncesi-sonrası görselleri, daha uzun içerik listeleri. Marka ekibi olarak tam tersini yaptık: soruyu saklamadık, kampanyanın adı yaptık.</p>

<h2>İçgörü: Tüketici ikna olmak değil, emin olmak istiyor</h2>
<p>Saç dökülmesi duygusal bir kategori. İnsanlar çoğu zaman birkaç ürün denemiş, hayal kırıklığı yaşamış ve reklam diline karşı bağışıklık kazanmış oluyor. Bu noktada markanın "ben iyiyim" demesi işe yaramıyor. İşe yarayan, gerçek bir insanın "ben kullandım, işe yaradı" demesi.</p>
<p>Bu yüzden fikir çok basitti: <b>soruyu marka sorsun, cevabı gerçek kullanıcılar versin.</b></p>

<h2>Fikri tek bir reklama hapsetmedik</h2>
<p>Kampanya bir film olarak değil, bir platform olarak kuruldu. Aynı fikir her temas noktasında farklı bir sesle konuştu:</p>
<ul style="margin: 0 0 22px; padding-left: 22px;">
<li><b>İki TV filmi:</b> Gerçek kullanıcı hikâyeleri TV'de, YouTube'da ve TikTok'ta.</li>
<li><b>500 influencer:</b> Aynı soruyu kendi deneyimleriyle, kendi cümleleriyle cevapladılar.</li>
<li><b>Deneyim mekânı:</b> İnsanlar markayla ekranda değil, yüz yüze tanıştı.</li>
<li><b>Eczane:</b> Ekranda yaratılan talep, rafta aynı cümleyle karşılandı.</li>
</ul>

<div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 14px; align-items: start;">

</figure>

<h2>Tek ağızdan 500 influencer</h2>
<p>Kampanyanın en çok konuşulan tarafı buydu. 500 influencer aynı mesajı verdi ama hiçbiri aynı cümleyi kurmadı. Her biri kendi takipçisine, kendi hayatından anlattı.</p>
<p>Burada önemli olan sayı değil, sistemdi. Influencer çalışmasını tek seferlik bir paylaşım olarak değil, ürün gönderimiyle başlayan, gerçek kullanımla devam eden ve satışa bağlanan bir zincir olarak kurduk. Tavsiye, reklamın ulaşamadığı güveni kurdu.</p>

<h2>Sonuç: Rakamlar ve bir de taklit</h2>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 8px 0 28px;">
<div style="background: #2A1D4A; color: #F5EFE6; border-radius: 16px; padding: 22px 18px;"><div class="d" style="font-weight: 800; font-size: 40px; line-height: 1; color: #E85D2A;">236M</div><div style="font-size: 15px; margin-top: 8px;">erişim</div></div>
<div style="background: #2A1D4A; color: #F5EFE6; border-radius: 16px; padding: 22px 18px;"><div class="d" style="font-weight: 800; font-size: 40px; line-height: 1; color: #E85D2A;">3M</div><div style="font-size: 15px; margin-top: 8px;">tıklama</div></div>
<div style="background: #2A1D4A; color: #F5EFE6; border-radius: 16px; padding: 22px 18px;"><div class="d" style="font-weight: 800; font-size: 40px; line-height: 1; color: #E85D2A;">+%120</div><div style="font-size: 15px; margin-top: 8px;">ürün büyümesi</div></div>
</div>
<p>Rakamlardan da kıymetli bir şey oldu: Bu yaklaşım, sonrasında kategoride benzer "gerçek kullanıcı" platformlarına ilham verdi. Bir fikrin yayılması, bence işe yaradığının en dürüst kanıtıdır.</p>

<h2>Kulisten üç not</h2>
<p><b>1. Tüketicinin itirazını saklama, sahiplen.</b> Kategorinin en büyük şüphesi, doğru kurulursa markanın en güçlü cümlesine dönüşür.</p>
<p><b>2. Fikri mecraya değil, mecrayı fikre bağla.</b> TV, sosyal medya, influencer, etkinlik ve eczane aynı soruyu sorduğu için her temas bir öncekini güçlendirdi.</p>
<p><b>3. Influencer'ı paylaşım olarak değil, sistem olarak kur.</b> Gönderim, gerçek kullanım, içerik ve satış noktası aynı zincirin halkaları olmalı.</p>

<blockquote class="d" style="margin: 40px 0; padding: 28px 30px; background: #E85D2A; color: #3A2550; border-radius: 18px; font-weight: 800; font-size: 28px; line-height: 1.2; letter-spacing: -0.02em;">“Tüketici reklama değil, güvendiği birinin tavsiyesine inanır.”</blockquote>

<p>Bir sonraki kulis yazısında aynı tavsiye fikrini bambaşka bir kategoride, takviyede nasıl kurduğumuzu anlatacağım: 14 ünlü, 56 film ve tek bir cümle. "Kime sorsam önerdi."</p>
</article>

<p style="margin: 0; font-size: 16px; line-height: 1.55; color: #4A3A62;">Aysun Bektaş, pazarlama ve marka iletişimi danışmanı. 12 yılı aşkın kariyerinde 9 markayla çalıştı, 150’yi aşkın ürün lansmanı yönetti. Marka stratejisini yaratıcı projelerle buluşturuyor; içerik üreticilerini ve influencer ekosistemini pazarlama süreçlerine entegre ederek markaların sesini duyurmasına destek oluyor. Bugün markalarla stratejiden uygulamaya birlikte çalışıyor. Pazarlama Kulisi’nde ise Türkiye’den ve dünyadan gelişmeleri marka, ajans, içerik üreticisi ve tüketici perspektiflerini bir araya getirerek yorumluyor.</p>
