<h1 class="d" style="margin: 0; font-weight: 800; font-size: clamp(40px, 5.6vw, 76px); line-height: 0.98; letter-spacing: -0.05em; max-width: 820px;">Her pazarlamacının izlemesi gereken <span style="font-style: italic; color: #E85D2A;">12 yapım</span></h1>
<p style="margin: 0; font-size: 21px; line-height: 1.5; color: #DDC5D2; max-width: 720px;">Yaratıcılığı besleyecek, markalara ve insan davranışlarına farklı bakmamızı sağlayacak 12 film, belgesel ve dizi. Her birinde aynı soru: "Peki, bu bizim için ne demek?"</p>
<div class="ilk" aria-hidden="true"><img src="../blog/12-yapim/01-art-and-copy.jpg" alt="" aria-hidden="true"><img src="../blog/12-yapim/02-the-century-of-the-self.jpg" alt="" aria-hidden="true"><img src="../blog/12-yapim/03-jiro-dreams-of-sushi.jpg" alt="" aria-hidden="true"><img src="../blog/12-yapim/04-the-creative-brain.jpg" alt="" aria-hidden="true"><img src="../blog/12-yapim/05-abstract-paula-scher.jpg" alt="" aria-hidden="true"><img src="../blog/12-yapim/06-the-persuaders.jpg" alt="" aria-hidden="true"><img src="../blog/12-yapim/07-air.jpg" alt="" aria-hidden="true"><img src="../blog/12-yapim/08-the-founder.jpg" alt="" aria-hidden="true"><img src="../blog/12-yapim/09-the-mind-explained.jpg" alt="" aria-hidden="true"><img src="../blog/12-yapim/10-parts-unknown.jpg" alt="" aria-hidden="true"><img src="../blog/12-yapim/11-the-greatest-movie-ever-sold.jpg" alt="" aria-hidden="true"><img src="../blog/12-yapim/12-thank-you-for-smoking.jpg" alt="" aria-hidden="true"></div>
<div style="display: flex; flex-wrap: wrap; gap: 14px; align-items: center; font-size: 15px; color: #DDC5D2;">
<img src="../assets/bcef58c9136b978233997bb49c9012e1.jpg" alt="" aria-hidden="true" style="width: 44px; height: 44px; border-radius: 50%; object-fit: cover; object-position: center 15%;">

<article style="max-width: 720px; margin: 0 auto; padding: 64px 24px 24px;">
<p>Merhaba,</p>
<p>Bir fikrin nasıl büyüdüğünü, bir markanın nasıl anlam kazandığını ya da bir insanın işinde nasıl ustalaştığını izlemek, kendi yaptıklarımıza da başka bir gözle bakmamızı sağlıyor.</p>
<p>Bu yazıda yaratıcılığı besleyecek, markalara ve insan davranışlarına farklı bakmamızı sağlayacak 12 film, belgesel ve diziyi bir araya getirdim. Her birinde aynı soruyu sordum: <b>"Peki, bu bizim için ne demek?"</b></p>
<p>Bir sonraki "Ne izlesem?" akşamı için listeniz hazır.</p>
<h2 style="margin-top: 40px;"><span class="n">01 · Belgesel</span>Art &amp; Copy</h2>
<figure class="yp"><img src="../blog/12-yapim/01-art-and-copy.jpg" alt="Art &amp; Copy film karesi" loading="lazy" width="1012" height="1350"></figure>
<p class="tema">Yaratıcılık ve reklam</p>
<p>"Just Do It" gibi kampanyaların arkasındaki reklamcılar, fikirlerin nasıl doğduğunu anlatıyor.</p>
<p><b>Neden izlemeli?</b> Bir reklam fikrinin hangi içgörüden doğduğunu görmek için.</p>
<div class="ne"><div class="t">Bizim için ne demek?</div><ul><li>Büyük fikir, masaya iyi bir içgörüyle gelindiğinde ortaya çıkıyor. Ajansa brief verirken "ne istiyoruz" kadar "tüketici hakkında ne biliyoruz" sorusunu da yazmak gerekiyor.</li></ul></div>
<h2 style="margin-top: 56px;"><span class="n">02 · Belgesel dizisi</span>The Century of the Self</h2>
<figure class="yp"><img src="../blog/12-yapim/02-the-century-of-the-self.jpg" alt="The Century of the Self film karesi" loading="lazy" width="1012" height="1350"></figure>
<p class="tema">Tüketim ve psikoloji</p>
<p>Adam Curtis, psikoloji ile reklam ve halkla ilişkiler arasındaki bağı tarihsel örneklerle inceliyor.</p>
<p><b>Neden izlemeli?</b> Satın alma isteğinin nasıl şekillendirildiğini sorgulamak için.</p>
<div class="ne"><div class="t">Bizim için ne demek?</div><ul><li>Tüketici çoğu zaman bir ürünü değil, o ürünle olmak istediği kişiyi satın alıyor. Bu gücü bilmek, onu sorumlulukla kullanmayı da gerektiriyor.</li></ul></div>
<h2 style="margin-top: 56px;"><span class="n">03 · Belgesel</span>Jiro Dreams of Sushi</h2>
<figure class="yp"><img src="../blog/12-yapim/03-jiro-dreams-of-sushi.jpg" alt="Jiro Dreams of Sushi film karesi" loading="lazy" width="1012" height="1350"></figure>
<p class="tema">Ustalık ve deneyim</p>
<p>Jiro Ono'nun Tokyo'daki küçük suşi restoranında, kusursuzluğa adanmış bir çalışma düzenini izliyoruz.</p>
<p><b>Neden izlemeli?</b> Üründen hizmete, tutarlı bir deneyimin nasıl kurulduğunu görmek için.</p>
<div class="ne"><div class="t">Bizim için ne demek?</div><ul><li>Marka, her gün aynı özenle tekrarlanan küçük detaylardan oluşuyor. Tutarlılık en sessiz ama en güçlü pazarlama aracı.</li></ul></div>
<h2 style="margin-top: 56px;"><span class="n">04 · Belgesel</span>The Creative Brain</h2>
<figure class="yp"><img src="../blog/12-yapim/04-the-creative-brain.jpg" alt="The Creative Brain film karesi" loading="lazy" width="1012" height="1350"></figure>
<p class="tema">Yaratıcı düşünme</p>
<p>David Eagleman, farklı alanlardan yaratıcı insanların yeni fikirleri nasıl geliştirdiğini araştırıyor.</p>
<p><b>Neden izlemeli?</b> Yaratıcılığı geliştiren alışkanlıklar üzerine düşünmek için.</p>
<div class="ne"><div class="t">Bizim için ne demek?</div><ul><li>Yaratıcılık bir ilham anı değil, beslenen bir kas. Farklı alanlardan okumak, izlemek ve gözlemlemek, ekibin fikir havuzunu doğrudan büyütüyor.</li></ul></div>
<h2 style="margin-top: 56px;"><span class="n">05 · Belgesel dizisi</span>Abstract: The Art of Design</h2>
<figure class="yp"><img src="../blog/12-yapim/05-abstract-paula-scher.jpg" alt="Abstract: The Art of Design film karesi" loading="lazy" width="1012" height="1350"></figure>
<p class="tema">1. sezon, 6. bölüm · Paula Scher · Görsel kimlik ve tasarım</p>
<p>Paula Scher'in çalışmaları üzerinden tipografinin bir markaya nasıl karakter kazandırdığını izliyoruz.</p>
<p><b>Neden izlemeli?</b> Markanın görsel dilinin yalnızca bir logodan oluşmadığını görmek için.</p>
<div class="ne"><div class="t">Bizim için ne demek?</div><ul><li>Tüketici markayla önce gözüyle tanışıyor. Yazı karakterinden renge kadar her tasarım kararı, markanın ne söylediğinin bir parçası.</li></ul></div>
<h2 style="margin-top: 56px;"><span class="n">06 · Belgesel</span>The Persuaders</h2>
<figure class="yp"><img src="../blog/12-yapim/06-the-persuaders.jpg" alt="The Persuaders film karesi" loading="lazy" width="1012" height="1350"></figure>
<p class="tema">Markalar ve ikna</p>
<p>Douglas Rushkoff, reklam ve halkla ilişkiler dünyasının insanları nasıl etkilemeye çalıştığını inceliyor.</p>
<p><b>Neden izlemeli?</b> Markaların ürünün ötesinde nasıl anlam sattığını anlamak için.</p>
<div class="ne"><div class="t">Bizim için ne demek?</div><ul><li>Ürün özelliği unutuluyor, anlam kalıyor. Markanın hangi duyguya ve değere ortak olduğunu net söyleyebilmek, iletişimin pusulası.</li></ul></div>
<h2 style="margin-top: 56px;"><span class="n">07 · Biyografik film (2023)</span>Air</h2>
<figure class="yp"><img src="../blog/12-yapim/07-air.jpg" alt="Air film karesi" loading="lazy" width="1012" height="1350"></figure>
<p class="tema">Doğru iş birliği, güçlü marka</p>
<p>Nike'ın Michael Jordan ile kurduğu ortaklığın Air Jordan markasına dönüşmesini konu alan bir film.</p>
<p><b>Neden izlemeli?</b> Bir iş birliğini, ünlü bir yüzün ötesine taşıyan stratejiyi görmek için.</p>
<div class="ne"><div class="t">Bizim için ne demek?</div><ul><li>Influencer ve ünlü seçiminde takipçi sayısı değil, uzun vadeli ortaklık ve hikâye uyumu belirleyici. Bir ismi kampanyaya değil, markaya ortak etmek bambaşka bir strateji.</li></ul></div>
<h2 style="margin-top: 56px;"><span class="n">08 · Biyografik film</span>The Founder</h2>
<figure class="yp"><img src="../blog/12-yapim/08-the-founder.jpg" alt="The Founder film karesi" loading="lazy" width="1012" height="1350"></figure>
<p class="tema">Büyüme ve sistem</p>
<p>Ray Kroc'un McDonald's ile yollarının kesişmesi ve restoran zincirinin büyümesi üzerine bir film.</p>
<p><b>Neden izlemeli?</b> Bir markayı büyütürken sistem ve standartların rolünü görmek için.</p>
<div class="ne"><div class="t">Bizim için ne demek?</div><ul><li>İyi bir ürün tek başına yetmiyor; onu tekrarlanabilir bir sisteme dönüştüren kazanıyor. Lansman planında "ilk satış" kadar "yüzüncü satış" da yazılı olmalı.</li></ul></div>
<h2 style="margin-top: 56px;"><span class="n">09 · Belgesel dizisi</span>The Mind, Explained</h2>
<figure class="yp"><img src="../blog/12-yapim/09-the-mind-explained.jpg" alt="The Mind, Explained film karesi" loading="lazy" width="1012" height="1350"></figure>
<p class="tema">Dikkat ve hafıza</p>
<p>Hafıza, dikkat ve kaygı gibi konular üzerinden zihnimizin nasıl çalıştığını keşfediyoruz.</p>
<p><b>Neden izlemeli?</b> Dikkat ve hafızanın iletişimdeki önemini düşünmek için.</p>
<div class="ne"><div class="t">Bizim için ne demek?</div><ul><li>Tüketicinin aklında kalmak, önce dikkatini kazanmakla başlıyor. Tek bir net mesaj, on dağınık mesajdan daha uzun yaşıyor.</li></ul></div>
<h2 style="margin-top: 56px;"><span class="n">10 · Belgesel dizisi</span>Parts Unknown</h2>
<figure class="yp"><img src="../blog/12-yapim/10-parts-unknown.jpg" alt="Parts Unknown film karesi" loading="lazy" width="1012" height="1350"></figure>
<p class="tema">Kültür ve hikâyeler</p>
<p>Anthony Bourdain, yemekleri bir başlangıç noktası olarak kullanıp farklı toplumların hikâyelerini dinliyor.</p>
<p><b>Neden izlemeli?</b> Aynı mesajın her kültürde aynı karşılığı bulmadığını hatırlamak için.</p>
<div class="ne"><div class="t">Bizim için ne demek?</div><ul><li>Yerel içgörü, global bir fikri gerçekten anlamlı kılan şey. Mesajı çevirmek yetmiyor; onu o kültürün hikâyesine yerleştirmek gerekiyor.</li></ul></div>
<h2 style="margin-top: 56px;"><span class="n">11 · Belgesel</span>The Greatest Movie Ever Sold</h2>
<figure class="yp"><img src="../blog/12-yapim/11-the-greatest-movie-ever-sold.jpg" alt="The Greatest Movie Ever Sold film karesi" loading="lazy" width="1012" height="1350"></figure>
<p class="tema">Marka iş birlikleri</p>
<p>Morgan Spurlock, marka sponsorlarıyla finanse ettiği bu filmde ürün yerleştirmenin işleyişini araştırıyor.</p>
<p><b>Neden izlemeli?</b> İçeriğin içine giren markaların süreci nasıl etkilediğini görmek için.</p>
<div class="ne"><div class="t">Bizim için ne demek?</div><ul><li>İçeriğe yerleşen marka, içeriğin değerine ortak olur ya da onu bozar. Görünürlük satın alırken hikâyenin doğallığını korumak, iş birliğinin asıl başarısı.</li></ul></div>
<h2 style="margin-top: 56px;"><span class="n">12 · Kurmaca film</span>Thank You for Smoking</h2>
<figure class="yp"><img src="../blog/12-yapim/12-thank-you-for-smoking.jpg" alt="Thank You for Smoking film karesi" loading="lazy" width="1012" height="1350"></figure>
<p class="tema">İkna ve sorumluluk</p>
<p>Bir tütün lobicisinin hikâyesi üzerinden, tartışmalı bir fikrin nasıl savunulabildiğini izliyoruz.</p>
<p><b>Neden izlemeli?</b> Güçlü bir anlatımla haklı olmanın farkını sorgulamak için.</p>
<div class="ne"><div class="t">Bizim için ne demek?</div><ul><li>İkna bir beceri, ama neyi ikna ettiğimiz bir sorumluluk. Özellikle iddiaların sınırlı olduğu kategorilerde, "nasıl söylediğimiz" kadar "ne vaat ettiğimiz" de markanın geleceğini belirliyor.</li></ul></div>
<h2 style="margin-top: 56px;"><span class="n">Kapanış</span>Bu listeden aklımda kalan</h2>
<figure class="yp"><img src="../blog/12-yapim/13-kapanis.jpg" alt="İlk hangisini izleyeceksin?" loading="lazy" width="1012" height="1350"></figure>
<p>12 yapım, 12 farklı bakış. Ama ortak nokta şu: iyi bir fikir, çoğu zaman başka bir hikâyeden doğuyor. Bir suşi ustasının disiplininden, bir tasarımcının harflerinden, bir lobicinin cümlelerinden…</p>
<p>Reklam biter; hikâye konuşulmaya devam eder.</p>
<p>İlk hangisini izleyeceksiniz? Sizin listenizde olup da benimkinde olmayanı da yazın, bir sonraki listeye birlikte ekleyelim.</p>
<p>Aysun</p>
