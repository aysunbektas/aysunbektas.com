<h1 class="d" style="margin: 0; font-weight: 800; font-size: clamp(40px, 5.6vw, 76px); line-height: 0.98; letter-spacing: -0.05em; max-width: 820px;">Herkes aynı şeyi optimize ederken <span style="font-style: italic; color: #F5EFE6;">fark yaratanlar</span> ne yapıyor?</h1>
<p style="margin: 0; font-size: 21px; line-height: 1.5; color: #3A2550; max-width: 720px;">Her hafta onlarca yerli ve yabancı pazarlama bülteni okuyorum. Bu sayıda, bir pazarlamacının yarın sabah işine katabileceği 8 ders ve takvime not alınacak 5 gelişme var.</p>
<div style="display: flex; flex-wrap: wrap; gap: 14px; align-items: center; font-size: 15px; color: #4A3A62;">
<img src="../assets/bcef58c9136b978233997bb49c9012e1.jpg" alt="" aria-hidden="true" style="width: 44px; height: 44px; border-radius: 50%; object-fit: cover; object-position: center 15%;">
<span><b style="color: #2A1D4A;">Aysun Bektaş</b> · 9 dakikalık okuma</span>
<a href="https://www.linkedin.com/pulse/herkes-ayn%C4%B1-%C5%9Feyi-optimize-ederken-fark-yaratanlar-ne-yap%C4%B1yor-bekta%C5%9F-g4nhf/" class="m" style="font-size: 11px; color: #2A1D4A; text-decoration: none; margin-left: auto; border-bottom: 1px solid #2A1D4A;">LinkedIn'de oku ↗</a>
</div>
</div>
</section>

<section style="background: #211743; color: #F5EFE6; border-top: 1px solid #473867;">
<div style="max-width: 920px; margin: 0 auto; padding: 36px 24px; display: flex; flex-wrap: wrap; gap: 28px; align-items: center;">
<div class="m" style="font-size: 11px; color: #E85D2A; flex: 0 0 auto;">Bu haftanın tezi</div>
<p class="d" style="margin: 0; flex: 1 1 420px; min-width: 0; font-weight: 600; font-size: clamp(20px, 2.4vw, 28px); line-height: 1.3; letter-spacing: -0.02em;">Yapay zekâ ve algoritmalar her şeyi birbirine benzetirken kazananlar ya <span class="gi">en tanıdık</span> ya da <span class="gi">en beklenmedik</span> marka olmayı seçiyor. Arada kalanlar görünmez oluyor.</p>

<article style="max-width: 720px; margin: 0 auto; padding: 64px 24px 24px;">
<p>Kural basitti: sadece "ne oldu" değil, "bununla ne yaparım" sorusuna da cevap veren haberler listeye girdi.</p>

<h2 style="margin-top: 40px;"><span class="n">01</span>Yapay zekâ bir liste gösterdiğinde, tanıdık markaya tıklıyoruz</h2>
<div class="stat">
<div><b>%65</b><span>Asistanın listesinden tanıdığı markayı seçenler</span></div>
<div><b>%15</b><span>Ürün bilgisi yapay zekânın okuyabileceği durumda olan satıcılar</span></div>
<div><b>%40–50</b><span>B2B'de markayı hiç tanımadığı için listeye almayanlar</span></div>
</div>
<p>Serhat Gurcu'nun AI in Marketing bülteninde Black Friday öncesi derlediği veriler çarpıcı. Alışverişte araştırma yapay zekâ asistanlarına kayıyor, ama karar hâlâ insanda. Asistan bir liste sunduğunda insanların yüzde 65'i tanıdığı markayı seçiyor. İlk sıradaki öneriye gidenler yüzde 24, en ucuza gidenler yüzde 11. Visa'ya göre satıcıların yalnızca yüzde 15'inin ürün bilgisi yapay zekânın okuyabileceği durumda.</p>
<p>Temel Aksoy da "Büyük Marka Nasıl Olunur?" bülteninde aynı gerçeğin B2B tarafını anlatıyor. Ehrenberg-Bass verilerine göre markayı tanıyıp reddedenler yaklaşık yüzde 10; hiç tanımadığı için listeye bile almayanlar yüzde 40-50. Yani asıl rakibimiz ret değil, bilinmezlik.</p>
<div class="ne"><div class="t">Sizin için ne demek?</div><ul>
<li>Ürün sayfalarınızdaki fiyat, stok, içerik ve kullanım bilgisini düzenli ve okunabilir hale getirin. Yapay zekâ okuyamadığı markayı listeye koyamıyor.</li>
<li>İstatistik, güvenilir kaynak ve uzman görüşü içeren içerikler yapay zekâ yanıtlarında yüzde 40'a kadar daha görünür olabiliyor. Blog ve SSS sayfalarınızı bu gözle yeniden okuyun.</li>
<li>Bütçe toplantısında marka yatırımını savunmanız gerekirse "ret değil, bilinmezlik" verisi elinizin altında olsun.</li>
</ul></div>

<h2><span class="n">02</span>Yapay zekâ ajansın işini almıyor, işin yapıldığı masayı değiştiriyor</h2>
<p>Defne İncekara'nın "Devrettik" serisinin konuğu Semih Alacatlı, bir moda perakende markasında kampanya görsellerini yapay zekâyla üretiyor. Tablo şöyle: üretim şirketin içine geçiyor, ajans yön ve zevk veren tarafa kayıyor. En büyük kazanç bütçe değil zaman. Tam olarak devredemediği işse fikir bulmak.</p>
<p>İki detay çok değerli: ürünü görsele koymadan önce yapay zekâyla bir "dünya testi" yapıyorlar; sentetik modeller için yazdıkları komutun yaklaşık dörtte üçü, modelin gerçek bir kişiye benzememesine ayrılıyor. Defne'nin çerçevesi akılda kalıcı: <b>ilk yüzde 10 ve son yüzde 10 insanda, aradaki yüzde 80 yapay zekâda.</b></p>
<div class="ne"><div class="t">Sizin için ne demek?</div><ul>
<li>Çekimden önce konsepti, ışığı ve mekânı yapay zekâyla deneyin. Prodüksiyon günündeki sürprizler azalır.</li>
<li>Sentetik yüz kullanacaksanız bir benzerlik kontrolü ve etiketleme protokolü yazın. Bu artık bir tercih değil, itibar meselesi.</li>
<li>Ajansınızla iş bölümünü yeniden konuşun: üretimi kim yapacak, fikri ve zevki kim koruyacak?</li>
</ul></div>

<h2><span class="n">03</span>Herkes aynı videoyu çekiyorsa, fark beklentiyi bozmakta</h2>
<p>Rachel Karten, Link in Bio'da önemli bir uyarı yapıyor: içerik üretimine yapay zekâ araçları eklendikçe "işe yarayan içerik" tanımı daralıyor. Herkes aynı kancayı, aynı kurguyu, aynı formatı kullanıyor. Bu dönemde markaların rekabet avantajı, izleyicinin beklentisini planlı biçimde bozmak.</p>
<p>Canlı örnek Famous Campaigns'ten: Visit Oslo, 2024'te turistlere "gelmeyin" diyen huysuz karakteri Halfdan'ı bu kez bir Noel müzikaliyle geri getirdi.</p>
<div class="ne"><div class="t">Sizin için ne demek?</div><ul>
<li>Kategorinizin klişelerini listeleyin: aynı "uzman anlatıyor" kurgusu, aynı önce/sonra, aynı ambalaj çekimi. Sonra en az birini bilerek bozun.</li>
<li>İddiaların sınırlı olduğu kategorilerde yüksek sesli vaat zaten mümkün değil. Beklenmedik bir ton, hem ucuz hem güçlü bir farklılaşma alanı.</li>
<li>Bu tür içerikleri beğeniyle değil, kaydetme ve paylaşma oranıyla ölçün.</li>
</ul></div>

<h2><span class="n">04</span>Bir influencer kendi markasını kurunca: vaadin yerini kanıt alıyor</h2>
<p>Utku Yasavul'un The Asia Inspiration bülteninden bir vaka: Hindistan'da gıda etiketlerini didikleyen içerikleriyle tanınan Food Pharmer, kendi protein markasını satışa çıkardı. Kampanyada ürünün geçtiği 7 kalite testi anlatılıyor; tek bir paket testi geçemezse bütün üretim partisi imha ediliyor. Influencer'ı tanınır yapan şeffaflık, markanın ana vaadine dönüşmüş.</p>
<div class="ne"><div class="t">Sizin için ne demek?</div><ul>
<li>Sağlık beyanının sınırlı olduğu kategorilerde "ne yapar" yerine "nasıl üretilir, nasıl test edilir" anlatısı güven kurmanın en temiz yolu.</li>
<li>Kalite süreçlerinizde iletişime dönüşebilecek somut bir rakam ya da kural var mı? Test sayısı, ret kriteri, analiz sertifikası… Varsa, hikâyeniz orada.</li>
<li>Influencer'ı reklam yüzü olarak değil, ürün ortağı olarak düşünmek ayrı bir strateji başlığı.</li>
</ul></div>

<h2><span class="n">05</span>Creator'ı değiştirmeye çalışmayın, onun formatını büyütün</h2>
<p>Lia Haberman, ICYMI'de CreatorIQ Connect'ten notlar aktarıyor: en iyi iş birlikleri creator'ı başka biri olmaya zorlamıyor, zaten işleyen formatını genişletiyor. Toyota, Kareem Rahma ile yarış pilotlarıyla röportaj yaptığı dört bölümlük bir talk show çekti; UPS ise Rahma'nın mevcut serisini kendi şoförleri ve rotalarındaki küçük işletmelerle uyarladı. Disney ise tek seferlik kampanyalar yerine kalıcı bir "creator kadrosu" kuruyor.</p>
<div class="ne"><div class="t">Sizin için ne demek?</div><ul>
<li>Brief'e "ürünü göster" yazmadan önce creator'ın en çok izlenen serisini izleyin ve ürününüzün o seriye nasıl gireceğini önerin.</li>
<li>Tek seferlik paylaşım satın almak yerine, lansman takviminize bağlı 3-5 creator'lık yıllık bir kadro kurmayı hesaplayın.</li>
<li>Instagram, Reels'leri birbirine bağlama özelliğini 28 Ekim'de kaldırıyor. Bu özelliğe dayanan bir seri planınız varsa gözden geçirin.</li>
</ul></div>

<h2><span class="n">06</span>Hiçbir şey satmayan mağaza</h2>
<p>Marketing Brew'dan: hassas cilt markası Tower 28, ilk fiziksel mekânını bir mağaza gibi değil, bir topluluk merkezi gibi kurguladı. Yaklaşık 2.000 kişi geldi; ten rengi eşleştirme ve dolum istasyonu vardı ama hiçbir ürün satılmadı. Amaç ilişkiyi derinleştirmek. Pazarlamasyon'un aktardığı benzer bir fikir: McDonald's Londra'da geçici bir kasap dükkânı açıp köftelerin yalnızca et, tuz ve karabiberden oluştuğunu ziyaretçilere kendi köftelerini hazırlatarak gösterdi.</p>
<div class="ne"><div class="t">Sizin için ne demek?</div><ul>
<li>Dermokozmetikte satış eczanede kalabilir. Bir deneyim noktası ise cilt analizi, numune ve uzman sohbetiyle topluluk ve veri toplayabilir.</li>
<li>Böyle bir projenin başarısı ciroyla ölçülmez. Göstergeleri baştan belirleyin: CRM kaydı, sonradan gelen yorumlar, kullanıcı içeriği.</li>
<li>"Ürünün içinde ne var" sorusunu anlatmak yerine göstermek, iddiasız şeffaflığın en ikna edici biçimi.</li>
</ul></div>

<h2><span class="n">07</span>Ünlü yerine, yıllarca yaşayabilecek bir içgörü</h2>
<p>Creative Barista'da dikkatimi çeken haber Just Eat oldu. Marka, yeni global platformunda ünlü yüzden vazgeçip "bulunduğun anı bölme" içgörüsüne yaslanıyor. Gerekçesi: ünlüler esnek değil, ama bir insan gerçeği filmde, CRM'de, promosyonda ve sosyal medyada yıllarca yaşayabilir.</p>
<p>Head &amp; Shoulders'ın İngiltere çalışması da aynı çizgide: topluluk üyelerine numune, bir farkındalık ayı, bir hekim yüzü ve utanma duygusuna dayanan bir içgörü. Paylaşılan verilere göre marka tercihi yüzde 16'dan yüzde 21'e çıkmış. <i>(Not: veri, bülteni sponsorlayan ölçüm şirketinden geliyor.)</i></p>
<div class="ne"><div class="t">Sizin için ne demek?</div><ul>
<li>Ünlü bütçesini konuşmadan önce şunu sorun: bu kampanyanın arkasında üç yıl yaşayabilecek bir insan gerçeği var mı?</li>
<li>Numune, farkındalık ayı, uzman yüzü ve duygusal bir içgörü: dermokozmetik için neredeyse hazır bir şablon.</li>
<li>Başarıyı yalnızca bilinirlikle değil, yerinden oynatması en zor metrik olan tercihle ölçün.</li>
</ul></div>

<h2><span class="n">08</span>Sosyal dinlemeyi rapora değil, fikre bağlayın</h2>
<p>Chipotle'nin sosyal medya ekibi her gün toplanıp markanın etiketlendiği iyi ve kötü paylaşımları birlikte gözden geçiriyor. Buradan çıkanlar üç yere gidiyor: şikâyetleri çözmek, trendleri erken yakalamak ve büyük kampanya fikirleri üretmek.</p>
<div class="ne"><div class="t">Sizin için ne demek?</div><ul>
<li>Haftalık rapor yerine günde 15 dakikalık bir "etiket ve yorum" toplantısı deneyin.</li>
<li>Tüketicinin kendi cümlelerini not edin. İçerik takviminin ve ürün ekibinin en değerli girdisi bu cümleler.</li>
</ul></div>

<h2><span class="n">Kısa kısa</span>Takviminize not alın</h2>
<ul style="margin: 0 0 40px; padding-left: 22px;">
<li style="margin-bottom: 14px;"><b>Sosyal medyada 15 yaş sınırı.</b> 10 Ekim'de yayımlanan yönetmelikle platformlar 15 yaş altına hizmet veremeyecek; yaş doğrulama e-Devlet üzerinden yapılacak, 15 yaşını doldurmuş çocukların hesapları varsayılan olarak gizli olacak ve kişiselleştirilmiş reklam gösterilemeyecek. Yürürlük 1 Kasım 2026; mevcut hesaplar için doğrulama süresi 31 Mart 2027. Genç kitleye konuşan kategoriler medya planını ve influencer kitle analizini şimdiden gözden geçirmeli.</li>
<li style="margin-bottom: 14px;"><b>Meta'dan yeni formatlar.</b> Ads Super Burst, First Impression Ads ve Reels Trending Ads duyuruldu. Facebook'ta kullanıcılar ne görmek istediklerini yazarak akışlarını şekillendirebilecek.</li>
<li style="margin-bottom: 14px;"><b>Google'dan tek sepet.</b> ABD'de farklı mağazalardaki ürünleri tek sepette toplayan, fiyat takibi yapan yapay zekâ destekli sepet. Ürün verinizin makinece okunabilir olması giderek kritikleşiyor.</li>
<li style="margin-bottom: 14px;"><b>Amazon Hindistan'da creator ticareti.</b> Influencer programındaki creator sayısı bir yılda ikiye katlanıp 200 bine ulaştı; creator yönlendirmesiyle satılan ürün sayısı 100 milyonu aştı.</li>
<li><b>Ambalaj da bir deneyim.</b> Kutusu oyunun parçasına dönüşen bir mutfak oyuncağı ambalajı Pentawards'tan gümüş ödülle döndü.</li>
</ul>
